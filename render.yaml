# Render Blueprint: deploys the Time Management and ITSM app on Render's free plan.
# Render dashboard → New → Blueprint → pick this repository.
#
# The free plan has no persistent disk, so data is kept in PostgreSQL instead:
# create a free database at neon.tech or supabase.com and paste its connection
# string as DATABASE_URL when Render asks for it.
services:
  - type: web
    name: time-management-itsm
    runtime: node
    rootDir: time-management-itsm
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false          # PostgreSQL connection string (Neon / Supabase free tier)
      - key: ADMIN_PASSWORD
        sync: false          # password for the admin account on first start
