# Render Blueprint: deploys the Time Management and ITSM app.
# Render dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: time-management-itsm
    runtime: node
    rootDir: time-management-itsm
    plan: starter            # a persistent disk needs a paid instance
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false          # Render asks for it on first deploy; leave blank for admin/admin
    disk:
      name: itsm-data
      mountPath: /var/data
      sizeGB: 1
